<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home</title>

  <link rel="stylesheet" href="css/main.css">

</head>
<body>

  <section class="fs">
    <header class="header">
      <div class="header__container container">
        <div class="header__item-wrp header__logo-wrp">
          <div class="header__logo-text">Smart <span>Club</span></div>
        </div>
  
        <div class="header__item-wrp header__info-wrp"></div>
        <nav class="header__link-list link-list">
          <ul class="link-list__list">
            <li class="link-list__item">
              <a href="#" class="link-list__link">Как работает подписка</a>
            </li>
            <li class="link-list__item">
              <a href="#" class="link-list__link">Ваша выгода</a>
            </li>
            <li class="link-list__item">
              <a href="#" class="link-list__link">Наши плюшки</a>
            </li>
            <li class="link-list__item">
              <a href="#" class="link-list__link">Подписка</a>
            </li>
            <li class="link-list__item">
              <a href="#" class="link-list__link">О нас</a>
            </li>
            <li class="link-list__item">
              <a href="#" class="link-list__link">F.A.Q</a>
            </li>
            <li class="link-list__item">
              <a href="#" class="link-list__link">Контакты</a>
            </li>
          </ul>
  
          <a href="#" class="main-btn main-btn--blue">
            <span class="main-btn__text">помощь</span>
          </a>
        <nav>
      </div>
    </header>

    <div class="fs__container container">
      <div class="fs__title main-title">
        <h1>Заказы из магазинов зарубежных стран без комиссий и переплат</h1>
      </div>
      <div class="fs__img img-wrp">
        <img src="image/fs-image.png" alt="img">
      </div>
    </div>
  </section>

  <div class="ticker">
    <div class="ticker__track">
      <span class="ticker__item">
        <div class="ticker__flag-icon img-wrp">
          <img src="image/flags-icon/gflag.svg">
        </div>
        <span class="ticker__country-name">ГЕРМАНИЯ</span>
      </span>
      <span class="ticker__item">
        <div class="ticker__flag-icon img-wrp">
          <img src="image/flags-icon/vflag.svg">
        </div>
        <span class="ticker__country-name">ВЕЛИКОБРИТАНИЯ</span>
      </span>
      <span class="ticker__item">
        <div class="ticker__flag-icon img-wrp">
          <img src="image/flags-icon/iflag.svg">
        </div>
        <span class="ticker__country-name">ИТАЛИЯ</span>
      </span>
      <span class="ticker__item">
        <div class="ticker__flag-icon img-wrp">
          <img src="image/flags-icon/fflag.svg">
        </div>
        <span class="ticker__country-name">ФРАНЦИЯ</span>
      </span>
      <span class="ticker__item">
        <div class="ticker__flag-icon img-wrp">
          <img src="image/flags-icon/sflag.svg">
        </div>
        <span class="ticker__country-name">ИСПАНИЯ</span>
      </span>
      <span class="ticker__item">
        <div class="ticker__flag-icon img-wrp">
          <img src="image/flags-icon/pflag.svg">
        </div>
        <span class="ticker__country-name">ПОРТУГАЛИЯ</span>
      </span>
      <span class="ticker__item">
        <div class="ticker__flag-icon img-wrp">
          <img src="image/flags-icon/kflag.svg">
        </div>
        <span class="ticker__country-name">КОРЕЯ</span>
      </span>
      <span class="ticker__item">
        <div class="ticker__flag-icon img-wrp">
          <img src="image/flags-icon/jflag.svg">
        </div>
        <span class="ticker__country-name">ЯПОНИЯ</span>
      </span>
    </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
