<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>

  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <header class="header">
    <div class="container header__container">
      <div class="header__lng-switcher lng-switcher">
        <a href="#" class="lng-switcher__btn lng-switcher__btn--active text-main">RU</a>
        <a href="#" class="lng-switcher__btn text-main">EN</a>
      </div>

      <nav class="header__nav">
        <div class="header__nav-decoration header__nav-decoration--left img-wrp">
          <img src="image/header-decor-left.svg" alt="decoration">
        </div>
        <ul class="header__nav-list">
          <li class="header__nav-item">
            <a href="#" class="header__nav-link text-main">Начать игру</a>
          </li>
          <li class="header__nav-item">
            <a href="#" class="header__nav-link text-main">Форум</a>
          </li>
          <li class="header__nav-item">
            <a href="#" class="header__nav-link text-main">Discord</a>
          </li>
        </ul>
        <div class="header__nav-decoration header__nav-decoration--right img-wrp">
          <img src="image/header-decor-right.svg" alt="decoration">
        </div>
      </nav>

      <div class="header__main-menu main-menu">
        <div class="main-menu__head">
          <div class="main-menu__head-user-name text-main">Storm54</div>
          <div class="main-menu__head-open-menu-btn img-wrp">
            <svg width="16" height="12" viewBox="0 0 16 12" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M0 0H16L8.16025 12L0 0Z" fill="#F9BE7C"/>
            </svg>              
          </div>
          <div class="main-menu__head-user-avatar img-wrp">
            <img src="image/ava.png" alt="avatar">
          </div>

        </div>
      </div>

    </div>
  </header>

  <main>
    <section class="fs">
      <div class="fs__container container">
        <div class="fs__img-composition">
          <div class="fs__img-composition-img fs__img-composition-logo img-wrp">
            <img src="image/first-screen/composition/logo.png" alt="compsition img">
          </div>
          <div class="fs__img-composition-img fs__img-composition-wariors img-wrp">
            <img src="image/first-screen/composition/wariors.png" alt="compsition img">
          </div>
          <div class="fs__img-composition-img fs__img-composition-flag-left img-wrp">
            <img src="image/first-screen/composition/flag-left.png" alt="compsition img">
          </div>
          <div class="fs__img-composition-img fs__img-composition-flag-center img-wrp">
            <img src="image/first-screen/composition/flag-center.png" alt="compsition img">
          </div>
          <div class="fs__img-composition-img fs__img-composition-flag-right img-wrp">
            <img src="image/first-screen/composition/flag-right.png" alt="compsition img">
          </div>
        </div>

        <div class="fs__title text-main-title">Bannerlord Online Bannerlord Online уже доступна</div>
        <div class="fs__desc text-title">Bannerlord Online уже доступна.Погрузись в мир Кальрадии.</div>
        <button class="main-btn">
          <div class="main-btn__decoration main-btn__decoration--left img-wrp">
            <img src="image/header-decor-left.svg" alt="decoration">
          </div>
          <div class="main-btn__button text-main">Скачать игру</div>
          <div class="main-btn__decoration main-btn__decoration--right img-wrp">
            <img src="image/header-decor-right.svg" alt="decoration">
          </div>
        </button>
      </div>
    </section>
  </main>

</body>
</html>
